;align-items:start}.rank{font-size:11px;color:var(--txt-faint);padding-top:2px;letter-spacing:-.5px}.rank b{color:var(--green);font-weight:600}.ctitle{font-size:14.5px;line-height:1.42;color:#e4edf6;font-weight:500;margin:0 0 7px}.card.open .ctitle{color:#fff}.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10px;letter-spacing:.3px}.chip{border:1px solid var(--line-hot);border-radius:3px;padding:1.5px 5px;color:var(--txt-dim)}.chip.src{color:var(--cyan);border-color:#16384a}.chip.time{color:var(--txt-faint);border-color:transparent;padding-left:0}.chip.tag{color:var(--magenta);border-color:#3a1a44}.chip.coh{font-weight:700}.coh-ok{color:var(--green);border-color:var(--green-dim)}.coh-warn{color:var(--amber);border-color:#5c4310}.coh-bad{color:var(--red);border-color:#5c1a22}.coh-na{color:var(--txt-faint)}.bar{display:inline-block;width:34px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;vertical-align:1px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green))}.cbody{display:none;padding:0 12px 13px 52px}.card.open .cbody{display:block}.card.open .cbody{animation:slide .18s ease}@keyframes slide{from{opacity:0;transform:translateY(-4px)}}.bullets{list-style:none;margin:2px 0 12px;padding:0}.bullets li{position:relative;padding-left:15px;margin-bottom:8px;font-size:13px;line-height:1.55;color:var(--txt)}.bullets li::before{content:"▸";position:absolute;left:0;color:var(--green)}.bullets cite{display:block;font-style:normal;font-size:10px;color:var(--txt-faint);margin-top:2px;letter-spacing:.3px}.sublabel{font-size:10px;color:var(--txt-faint);letter-spacing:1.2px;margin:12px 0 6px;border-top:1px dashed var(--line);padding-top:9px}.srclist{display:flex;flex-direction:column;gap:5px}.srclist a{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--txt-dim)}.srclist a:hover{color:var(--cyan);text-decoration:none}.srclist .nm{color:var(--cyan);min-width:96px;flex-shrink:0;fon ble.matrix td.miss{color:var(--txt-faint)}table.matrix td.bad{color:var(--red);background:rgba(255,77,94,.09);font-weight:700}table.matrix td.good{color:var(--green)}table.matrix tr.row-conflict th{color:var(--red)}.conflict{border:1px solid var(--line);border-left:2px solid var(--red);background:var(--panel);border-radius:var(--r);padding:9px 11px;margin:7px 0}.conflict.sev-media{border-left-color:var(--amber)}.conflict.sev-bassa{border-left-color:var(--txt-faint)}.conflict .ctop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.conflict .lab{font-size:12px;color:#e4edf6;font-weight:600}.sev{font-size:9px;letter-spacing:1px;padding:1.5px 5px;border-radius:3px;font-weight:700}.sev.alta{color:var(--red);border:1px solid #5c1a22}.sev.media{color:var(--amber);border:1px solid #5c4310}.sev.bassa{color:var(--txt-faint);border:1px solid var(--line)}.claims{display:flex;flex-direction:column;gap:4px;margin-top:5px}.claim{display:flex;gap:8px;font-size:11.5px;align-items:baseline}.claim .who{color:var(--txt-dim);min-width:98px;flex-shrink:0}.claim .val{color:var(--green);font-weight:700;min-width:58px}.claim.out .val{color:var(--red)}.claim.out .who{color:var(--red)}.evid{font-size:10.5px;color:var(--txt-faint);line-height:1.5;margin-top:3px;border-left:1px solid var(--line-hot);padding-left:7px}#prompt{position:fixed;left:0;right:0;bottom:calc(52px + var(--safe-b));z-index:80;padding:0 14px 10px;display:none}#prompt.open{display:block}@media (min-width:720px){#prompt{bottom:0;padding-bottom:16px}}.promptbox{max-width:880px;margin:0 auto;background:rgba(8,12,18,.98);border:1px solid var(--green-dim);border-radius:var(--r);box-shadow:0 0 30px rgba(0,0,0,.7),0 0 0 1px rgba(61,252,168,.08)}.promptrow{display:flex;align-items:center;gap:8px;padding:9px 11px}.promptrow span{color:var(--green);font-weight:700}.promptrow input{flex:1;background:none;border:0;color:var(--txt);font:inherit;font-size:13px}.promptrow input:focus{outline:none}.promptout{border-top:1px solid var(--line);padding:8px 11px;font-size:11px;color:var(--txt-dim);max-height:45vh;overflow-y:auto;white-space:pre-wrap}.promptout:empty{display:none}.promptout b{color:var(--green)}.promptout i{color:var(--cyan);font-style:normal}.empty{text-align:center;padding:46px 18px;color:var(--txt-faint);font-size:12px;line-height:1.9}.empty b{color:var(--txt-dim);display:block;font-size:13px;margin-bottom:4px}.skel{height:74px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%);background-size:400% 100%;animation:sweep 1.3s linear infinite}@keyframes sweep{to{background-position:-200% 0}}footer{padding:26px 0 14px;font-size:10.5px;color:var(--txt-faint);line-height:1.8;border-top:1px solid var(--line);margin-top:26px}footer a{color:var(--txt-dim)}.offline{position:fixed;top:calc(var(--safe-t) + 6px);left:50%;transform:translateX(-50%);z-index:200;background:var(--amber);color:#120c00;font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:20px;letter-spacing:.5px;display:none}.offline.on{display:block}kbd{border:1px solid var(--line-hot);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:10px;color:var(--txt-dim)}</style>

<body>
<div id="boot" aria-hidden="true"></div>
<div class="offline" id="offline">◍ OFFLINE — dati dalla cache</div>
<header>
<div class="wrap">
<div class="hrow">
<div class="logo">info<b>J</b><span class="blk"></span></div>
<div class="spacer"></div>
<div class="led" id="led"><i></i><span id="ledtxt">SYNC…</span></div>
<button class="iconbtn" id="btnSearch" title="Cerca (tasto /)" aria-label="Cerca">⌕</button>
<button class="iconbtn" id="btnPrompt" title="Terminale (tasto :)" aria-label="Terminale">&gt;_</button>
</div>
<div class="searchrow" id="searchrow">
<input id="q" type="search" placeholder="filtra le notizie…" autocomplete="off" spellcheck="false">
</div>
<div class="statusbar" id="status"></div>
</div>
</header>
<div class="navwrap">
<nav class="tabs" id="tabs">
<button data-v="trieste"><span class="ic">◈</span>TRIESTE</button>
<button data-v="italia"><span class="ic">◆</span>ITALIA</button>
<button data-v="mondo"><span class="ic">◉</span>MONDO</button>
<button data-v="diff"><span class="ic">⇄</span>DIFF</button>
</nav>
</div>
<main class="wrap" id="app"></main>
<div id="prompt">
<div class="promptbox">
<div class="promptrow">
<span>&gt;</span>
<input id="cmd" autocomplete="off" spellcheck="false" placeholder="help per i comandi">
</div>
<div class="promptout" id="cmdout"></div>
</div>
</div>
<div class="wrap">
<footer>
<div>infoJ — aggregatore e comparatore di notizie. Aggiornamento automatico ogni ora via GitHub Actions.</div>
<div>Ogni notizia rimanda alla fonte originale: i titoli e i testi appartengono alle rispettive testate.</div>
<div id="footmeta"></div>
</footer>
</div>
<script>
(function () {
"use strict";
var SECTIONS = { trieste: "TRIESTE, ITALIA", italia: "ITALIA", mondo: "INTERNAZIONALE", diff: "INCOERENZE" };
var S = {
meta: null, data: {}, diff: null, view: "trieste",
q: "", cursor: -1, open: {}, loaded: false, err: null
};
var $ = function (s, r) { return (r || document).querySelector(s); };
var app = $("#app");
function esc(s) {
return String(s == null ? "" : s)
.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
.replace(/"/g, "&quot;");
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function ago(ts) {
var d = Math.floor(Date.now() / 1000) - ts;
if (d < 90) return "ora";
if (d < 3600) return Math.floor(d / 60) + " min fa";
if (d < 79200) return Math.floor(d / 3600) + "h fa";
var dt = new Date(ts * 1000);
var days = Math.floor(d / 86400);
return (days < 2 ? "ieri " : days + "g fa ") + pad(dt.getHours()) + ":" + pad(dt.getMinutes());
}
function clock() {
var d = new Date();
return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function cohClass(v) {
if (v == null) return "coh-na";
if (v >= 90) return "coh-ok";
if (v >= 70) return "coh-warn";
return "coh-bad";
}
function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
var BOOT = [
["dim", "infoJ v1.0.0 — news aggregation & cross-source fact diff"],
["dim", "(c) Gigat02 · build statica · nessun tracciamento"],
["", ""],
["ok", "[ ok ] inizializzazione terminale"],
["ok", "[ ok ] montaggio dataset locale"],
["hi", "[ .. ] connessione al feed store"],
["ok", "[ ok ] 63 sorgenti registrate"],
["ok", "[ ok ] motore di confronto fatti pronto"],
["", ""],
["hi", "avvio interfaccia…"]
];
function boot(done) {
var el = $("#boot");
if (sessionStorage.getItem("infoj.booted") ||
window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
el.remove(); done(); return;
}
sessionStorage.setItem("infoj.booted", "1");
var i = 0, html = "";
(function step() {
if (i >= BOOT.length) {
el.classList.add("done");
setTimeout(function () { el.remove(); }, 300);
done(); return;
}
var row = BOOT[i++];
html += '<span class="' + row[0] + '">' + esc(row[1]) + "</span>\n";
el.innerHTML = html + '<span class="caret"></span>';
setTimeout(step, row[1] === "" ? 40 : 95);
})();
}
function getJSON(url) {
return fetch(url, { cache: "no-cache" }).then(function (r) {
if (!r.ok) throw new Error(url + " HTTP " + r.status);
return r.json();
});
}
function load() {
return getJSON("data/meta.json").catch(function () { return null; })
.then(function (meta) {
S.meta = meta;
var v = meta ? "?v=" + meta.generated_ms : "";
return Promise.all([
getJSON("data/trieste.json" + v),
getJSON("data/italia.json" + v),
getJSON("data/mondo.json" + v),
getJSON("data/incoerenze.json" + v)
]);
})
.then(function (r) {
S.data.trieste = r[0].stories || [];
S.data.italia = r[1].stories || [];
S.data.mondo = r[2].stories || [];
S.diff = r[3];
S.loaded = true;
})
.catch(function (e) { S.err = e.message || String(e); });
}
function paintStatus() {
var m = S.meta, led = $("#led"), txt = $("#ledtxt");
if (!m) { txt.textContent = "NO DATA"; led.className = "led err"; return; }
var age = (Date.now() - m.generated_ms) / 60000;
led.className = "led" + (age > 190 ? " err" : age > 95 ? " warn" : "");
txt.textContent = clock();
var conf = m.conflicts_total || 0;
$("#status").innerHTML =
"<span>agg. <b>" + esc(ago(Math.floor(m.generated_ms / 1000))) + "</b></span>" +
"<span>feed <b>" + m.feeds_ok + "/" + m.feeds_total + "</b></span>" +
"<span>articoli <b>" + num(m.articles_total) + "</b></span>" +
"<span>confronti <b>" + (m.reports_total || 0) + "</b></span>" +
"<span class='" + (m.conflicts_high ? "hot" : "") + "'>incoerenze <b>" + conf + "</b></span>";
$("#footmeta").innerHTML = "build " + esc(m.version) + " · generato il " +
esc(new Date(m.generated_ms).toLocaleString("it-IT")) + " in " + m.build_seconds + "s · " +
'<a href="data/meta.json">meta.json</a>';
var badge = document.querySelector('#tabs [data-v="diff"] .badge');
if (m.conflicts_high > 0 && !badge) {
var b = document.createElement("span");
b.className = "badge"; b.textContent = m.conflicts_high;
document.querySelector('#tabs [data-v="diff"]').appendChild(b);
}
}
function matchQuery(st) {
if (!S.q) return true;
var q = S.q.toLowerCase();
var hay = st.headline + " " + (st.tags || []).join(" ") + " " +
(st.outlets || []).join(" ") + " " + (st.bullets || []).map(function (b) { return b.text; }).join(" ");
return hay.toLowerCase().indexOf(q) >= 0;
}
function cardHTML(st, i) {
var coh = st.coherence || {};
var cohTxt = coh.analyzed
? "COERENZA " + coh.score + (coh.n_conflicts ? " ⚠" + coh.n_conflicts : " ✓")
: "NON CONFRONTABILE";
var tags = (st.tags || []).slice(0, 3).map(function (t) {
return '<span class="chip tag">#' + esc(t.replace(/\s+/g, "")) + "</span>";
}).join("");
var bullets = (st.bullets || []).map(function (b) {
return "<li>" + esc(b.text) + "<cite>— " + esc(b.source) + "</cite></li>";
}).join("");
var srcs = (st.sources || []).map(function (s) {
return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' +
'<span class="nm">' + esc(s.name) + "</span>" +
'<span class="tt">' + esc(s.title) + "</span>" +
'<span class="ex">' + esc(ago(s.ts)) + " ↗</span></a>";
}).join("");
var cohLine = coh.analyzed
? "Confrontate <b>" + coh.checked + "</b> grandezze su " + st.n_outlets +
" testate → coerenza <b>" + coh.score + "/100</b>" +
(coh.n_conflicts ? ", <b>" + coh.n_conflicts + "</b> discordanze rilevate." : ", nessuna discordanza.")
: esc(coh.reason || "confronto non disponibile");
return '<article class="card' + (S.open[st.id] ? " open" : "") + (S.cursor === i ? " cursor" : "") +
'" data-id="' + esc(st.id) + '" data-i="' + i + '">' +
'<button class="chead" aria-expanded="' + (S.open[st.id] ? "true" : "false") + '">' +
'<span class="rank"><b>' + pad(st.rank) + "</b></span>" +
"<span>" +
'<h2 class="ctitle">' + esc(st.headline) + "</h2>" +
'<span class="meta">' +
'<span class="chip src">' + st.n_outlets + " FONTI</span>" +
'<span class="chip coh ' + cohClass(coh.analyzed ? coh.score : null) + '">' + cohTxt + "</span>" +
tags +
'<span class="chip time">' + esc(ago(st.last_ts)) + "</span>" +
'<span class="bar" title="rilevanza ' + st.score + '"><i style="width:' +
Math.max(6, Math.min(100, st.score)) + '%"></i></span>' +
"</span>" +
"</span>" +
"</button>" +
'<div class="cbody">' +
(bullets ? '<ul class="bullets">' + bullets + "</ul>" : "") +
'<div class="sublabel">VERIFICA INCROCIATA</div>' +
'<div style="font-size:11.5px;color:var(--txt-dim);line-height:1.6">' + cohLine + "</div>" +
'<div class="sublabel">FONTI (' + (st.sources || []).length + ")</div>" +
'<div class="srclist">' + srcs + "</div>" +
'<div class="actions">' +
(coh.analyzed ? '<button class="btn p" data-diff="' + esc(st.id) + '">⇄ apri confronto</button>' : "") +
'<button class="btn" data-share="' + esc(st.id) + '">⤴ condividi</button>' +
"</div>" +
"</div></article>";
}
function renderStories() {
var list = (S.data[S.view] || []).filter(matchQuery);
var total = (S.data[S.view] || []).length;
var head = '<div class="sectitle"><h1>' + SECTIONS[S.view] + "</h1><span>" +
list.length + (S.q ? "/" + total + " risultati" : " notizie") +
(S.meta ? " · aggiornate " + esc(ago(Math.floor(S.meta.generated_ms / 1000))) : "") +
"</span></div>";
if (!list.length) {
app.innerHTML = head + '<div class="empty"><b>nessun risultato</b>' +
(S.q ? "nessuna notizia corrisponde a «" + esc(S.q) + "»"
: "il prossimo aggiornamento arriva entro un'ora") + "</div>";
return;
}
app.innerHTML = head + list.map(cardHTML).join("");
}
function matrixHTML(rep) {
var keys = Object.keys(rep.matrix);
if (!keys.length) return "";
var conflictKeys = {};
rep.conflicts.forEach(function (c) { if (c.type === "numerico") conflictKeys[c.key] = c; });
var outs = rep.sources.map(function (s) { return s.name; });
var head = "<tr><th>grandezza</th>" + outs.map(function (o) {
return "<th>" + esc(o) + "</th>";
}).join("") + "</tr>";
var rows = keys.map(function (k) {
var row = rep.matrix[k], conf = conflictKeys[k];
var cells = outs.map(function (o) {
var c = row.cells[o];
if (!c) return '<td class="miss">—</td>';
var bad = conf && conf.outliers && conf.outliers.indexOf(o) >= 0;
return '<td class="' + (bad ? "bad" : conf ? "good" : "") + '" title="' +
esc((c.evidence || "").slice(0, 180)) + '">' + esc(c.display) + (c.approx ? " ~" : "") + "</td>";
}).join("");
return '<tr class="' + (conf ? "row-conflict" : "") + '"><th>' + esc(row.label) + "</th>" + cells + "</tr>";
}).join("");
var wide = outs.length > 2;
return '<div class="tablescroll"><div class="tablewrap"><table class="matrix"><thead>' + head +
"</thead><tbody>" + rows + "</tbody></table></div></div>" +
(wide ? '<div class="scrollhint">' + outs.length + " testate a confronto — scorri →</div>" : "");
}
function conflictHTML(c) {
var claims = (c.sources || []).slice(0, 6).map(function (s) {
return '<div class="claim' + (s.outlier ? " out" : "") + '">' +
'<span class="who">' + esc(s.source) + "</span>" +
'<span class="val">' + esc(s.display) + "</span></div>" +
(s.evidence ? '<div class="evid">« ' + esc(s.evidence.slice(0, 230)) + " »</div>" : "");
}).join("");
var kind = c.type === "numerico" ? "dato discordante"
: c.type === "omissione" ? "dato omesso" : "lessico opposto";
return '<div class="conflict sev-' + c.severity + '">' +
'<div class="ctop"><span class="lab">' + esc(c.label) + "</span>" +
'<span class="sev ' + c.severity + '">' + c.severity.toUpperCase() + "</span>" +
'<span class="chip">' + kind + "</span>" +
(c.delta ? '<span class="chip">scarto ' + c.delta + "%</span>" : "") +
(c.consensus ? '<span class="chip src">prevalente: ' + esc(c.consensus) + "</span>" : "") +
'</div><div class="claims">' + claims + "</div></div>";
}
function diffCardHTML(rep, i) {
var open = S.open["d" + rep.story_id];
var cls = cohClass(rep.score);
var n = rep.conflicts.length;
return '<article class="card' + (open ? " open" : "") + (S.cursor === i ? " cursor" : "") +
'" data-id="d' + esc(rep.story_id) + '" data-i="' + i + '">' +
'<button class="chead" aria-expanded="' + (open ? "true" : "false") + '">' +
'<span class="rank gauge ' + cls + '">' + rep.score + "<br><small>/100</small></span>" +
"<span>" +
'<h2 class="ctitle">' + esc(rep.headline) + "</h2>" +
'<span class="meta">' +
'<span class="chip src">' + rep.n_outlets + " TESTATE" + (rep.solid ? " ✓" : "") + "</span>" +
'<span class="chip">' + rep.checked_measures + " GRANDEZZE</span>" +
'<span class="chip ' + (n ? "coh-bad" : "coh-ok") + '">' +
(n ? n + " DISCORDANZE" : "COERENTE") + "</span>" +
'<span class="chip tag">#' + esc(rep.section) + "</span>" +
'<span class="chip time">' + esc(ago(rep.last_ts)) + "</span>" +
"</span>" +
"</span>" +
"</button>" +
'<div class="cbody">' +
'<div class="sublabel">MATRICE DEI DATI DICHIARATI</div>' + matrixHTML(rep) +
(n ? '<div class="sublabel">DISCORDANZE (' + n + ")</div>" +
rep.conflicts.map(conflictHTML).join("")
: '<div style="font-size:11.5px;color:var(--green)">✓ Nessuna discordanza: ' +
"le testate riportano gli stessi valori su tutte le grandezze confrontate.</div>") +
'<div class="sublabel">ARTICOLI CONFRONTATI</div><div class="srclist">' +
rep.sources.map(function (s) {
return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' +
'<span class="nm">' + esc(s.name) + "</span>" +
'<span class="tt">' + num(s.chars) + " caratteri analizzati</span>" +
'<span class="ex">↗</span></a>';
}).join("") + "</div>" +
"</div></article>";
}
function renderDiff() {
var reps = (S.diff && S.diff.reports) || [];
if (S.q) {
var q = S.q.toLowerCase();
reps = reps.filter(function (r) { return (r.headline + " " + r.section).toLowerCase().indexOf(q) >= 0; });
}
var withConf = reps.filter(function (r) { return r.conflicts.length; });
var head = '<div class="sectitle"><h1>INCOERENZE</h1><span>' + reps.length +
" notizie confrontate · " + withConf.length + " con discordanze</span></div>" +
'<div class="diffnote">' +
"Ogni notizia seguita da almeno <b>" + ((S.diff && S.diff.min_outlets) || 3) +
"</b> testate viene analizzata: dai testi originali vengono estratte le grandezze citate " +
"(vittime, feriti, arresti, importi, percentuali…), raggruppate per tipo e confrontate fra loro. " +
"Quando due testate dichiarano valori incompatibili il dato viene marcato e viene mostrata la frase " +
"che lo contiene, <b>con il link all'articolo</b>: la verifica finale resta tua.<br>" +
"<code>alta</code> = scarto su un dato sensibile (vittime, feriti, arresti) · " +
"<code>media</code> = scarto oltre l'8% · <code>bassa</code> = differenza marginale, omissione o lessico opposto. " +
"Il simbolo <code>~</code> segnala un valore dichiarato come approssimato.</div>";
if (!reps.length) {
app.innerHTML = head + '<div class="empty"><b>nessun confronto disponibile</b>' +
"servono almeno 3 testate sulla stessa notizia</div>";
return;
}
app.innerHTML = head + reps.map(diffCardHTML).join("");
}
function bindScrollHints() {
Array.prototype.forEach.call(document.querySelectorAll(".tablewrap"), function (w) {
if (w.dataset.bound) return;
w.dataset.bound = "1";
var box = w.parentElement;
var upd = function () {
box.classList.toggle("end", w.scrollLeft + w.clientWidth >= w.scrollWidth - 4);
};
w.addEventListener("scroll", upd, { passive: true });
upd();
});
}
function render() {
if (S.err && !S.loaded) {
app.innerHTML = '<div class="empty"><b>dati non raggiungibili</b>' + esc(S.err) +
"<br>ricarica la pagina o riprova fra poco</div>";
return;
}
if (!S.loaded) { app.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
S.view === "diff" ? renderDiff() : renderStories();
bindScrollHints();
Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
b.classList.toggle("on", b.dataset.v === S.view);
});
}
function go(view, push) {
if (!SECTIONS[view]) view = "trieste";
S.view = view; S.cursor = -1;
if (push !== false && location.hash !== "#/" + view) location.hash = "#/" + view;
render();
window.scrollTo(0, 0);
}
document.addEventListener("click", function (e) {
var tab = e.target.closest("#tabs button");
if (tab) { go(tab.dataset.v); return; }
var diffBtn = e.target.closest("[data-diff]");
if (diffBtn) {
var id = diffBtn.getAttribute("data-diff");
S.open["d" + id] = true; S.q = ""; $("#q").value = "";
go("diff");
var el = document.querySelector('[data-id="d' + id + '"]');
if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
return;
}
var share = e.target.closest("[data-share]");
if (share) {
var sid = share.getAttribute("data-share");
var st = (S.data[S.view] || []).filter(function (x) { return x.id === sid; })[0];
if (!st) return;
var payload = { title: "infoJ", text: st.headline, url: location.href };
if (navigator.share) { navigator.share(payload).catch(function () {}); }
else if (navigator.clipboard) {
navigator.clipboard.writeText(st.headline + " — " + location.href);
share.textContent = "✓ copiato";
setTimeout(function () { share.textContent = "⤴ condividi"; }, 1600);
}
return;
}
var head = e.target.closest(".chead");
if (head) {
bindScrollHints();
var card = head.closest(".card"), cid = card.dataset.id;
S.open[cid] = !S.open[cid];
card.classList.toggle("open", !!S.open[cid]);
head.setAttribute("aria-expanded", S.open[cid] ? "true" : "false");
if (S.open[cid]) {
var top = card.getBoundingClientRect().top;
if (top < 60) window.scrollBy(0, top - 70);
}
}
});
var searchOpen = false;
function toggleSearch(force) {
searchOpen = force == null ? !searchOpen : force;
$("#searchrow").classList.toggle("open", searchOpen);
if (searchOpen) $("#q").focus();
else { $("#q").value = ""; S.q = ""; render(); }
}
$("#btnSearch").addEventListener("click", function () { toggleSearch(); });
var tmr;
$("#q").addEventListener("input", function (e) {
clearTimeout(tmr);
var v = e.target.value;
tmr = setTimeout(function () { S.q = v.trim(); render(); }, 130);
});
var HIST = [], hi = -1;
function promptOpen(on) {
$("#prompt").classList.toggle("open", on);
if (on) $("#cmd").focus(); else { $("#cmd").value = ""; $("#cmdout").innerHTML = ""; }
}
$("#btnPrompt").addEventListener("click", function () {
promptOpen(!$("#prompt").classList.contains("open"));
});
function out(html) { $("#cmdout").innerHTML = html; }
var COMMANDS = {
help: function () {
out("comandi disponibili:\n" +
"  <b>trieste</b> | <b>italia</b> | <b>mondo</b> | <b>diff</b>   cambia sezione\n" +
"  <b>cerca</b> &lt;testo&gt;      filtra le notizie\n" +
"  <b>apri</b> &lt;n&gt;           apre la notizia numero n\n" +
"  <b>fonti</b>               testate presenti in questa sezione\n" +
"  <b>stato</b>               diagnostica dell'ultimo aggiornamento\n" +
"  <b>json</b>                dataset grezzi\n" +
"  <b>chiudi</b> / <b>pulisci</b>    chiude tutto\n\n" +
"scorciatoie: <i>/</i> cerca · <i>:</i> terminale · <i>j/k</i> naviga · " +
"<i>invio</i> apre · <i>1-4</i> sezioni · <i>esc</i> chiude");
},
stato: function () {
var m = S.meta;
if (!m) return out("nessun metadato caricato.");
out("generato:   <i>" + esc(new Date(m.generated_ms).toLocaleString("it-IT")) + "</i>\n" +
"durata build: " + m.build_seconds + "s\n" +
"feed attivi:  <b>" + m.feeds_ok + "/" + m.feeds_total + "</b>\n" +
"articoli:     " + num(m.articles_total) + "\n" +
"confronti:    " + m.reports_total + " (" + m.conflicts_total + " discordanze, " +
(m.conflicts_high || 0) + " gravi)\n" +
"traduttore:   " + esc(JSON.stringify(m.translator || {})) + "\n" +
(m.feeds_failed && m.feeds_failed.length
? "non raggiunti: " + esc(m.feeds_failed.join(", ")) : "tutti i feed raggiunti"));
},
fonti: function () {
var c = {};
(S.view === "diff" ? [] : S.data[S.view] || []).forEach(function (st) {
(st.outlets || []).forEach(function (o) { c[o] = (c[o] || 0) + 1; });
});
var arr = Object.keys(c).sort(function (a, b) { return c[b] - c[a] || a.localeCompare(b); });
if (!arr.length) return out("nessuna fonte in questa vista.");
out(arr.length + " testate in questa sezione:\n" + arr.map(function (k) {
return "  " + (c[k] + "").padStart(2) + "×  <i>" + esc(k) + "</i>";
}).join("\n"));
},
json: function () {
out("dataset pubblici:\n" +
["trieste", "italia", "mondo", "incoerenze", "meta"].map(function (f) {
return '  <a href="data/' + f + '.json" target="_blank">data/' + f + ".json</a>";
}).join("\n"));
},
pulisci: function () { S.open = {}; S.q = ""; $("#q").value = ""; render(); out("stato azzerato."); },
whoami: function () { out("ospite@infoJ — sola lettura. il codice e' su GitHub, forkalo pure."); }
};
COMMANDS.clear = COMMANDS.pulisci;
COMMANDS.status = COMMANDS.stato;
COMMANDS.sources = COMMANDS.fonti;
COMMANDS.chiudi = function () { promptOpen(false); };
function runCmd(line) {
line = line.trim();
if (!line) return;
HIST.unshift(line); hi = -1;
var parts = line.split(/\s+/), cmd = parts[0].toLowerCase(), rest = parts.slice(1).join(" ");
if (SECTIONS[cmd]) { go(cmd); out("→ sezione <i>" + esc(cmd) + "</i>"); return; }
if (cmd === "cerca" || cmd === "search" || cmd === "grep") {
S.q = rest; toggleSearch(true); $("#q").value = rest; render();
out("filtro: <i>" + esc(rest || "(vuoto)") + "</i>"); return;
}
if (cmd === "apri" || cmd === "open") {
var n = parseInt(rest, 10);
var list = S.view === "diff" ? (S.diff ? S.diff.reports : []) : S.data[S.view] || [];
var st = list[n - 1];
if (!st) return out("indice fuori intervallo (1–" + list.length + ").");
var key = (S.view === "diff" ? "d" : "") + (st.id || st.story_id);
S.open[key] = true; render();
var el = document.querySelector('[data-id="' + key + '"]');
if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
out("aperta: <i>" + esc(st.headline) + "</i>"); return;
}
if (COMMANDS[cmd]) return COMMANDS[cmd]();
out("comando sconosciuto: <i>" + esc(cmd) + "</i> — prova <b>help</b>");
}
$("#cmd").addEventListener("keydown", function (e) {
if (e.key === "Enter") { runCmd(e.target.value); e.target.value = ""; }
else if (e.key === "Escape") promptOpen(false);
else if (e.key === "ArrowUp" && HIST.length) { hi = Math.min(hi + 1, HIST.length - 1); e.target.value = HIST[hi]; e.preventDefault(); }
else if (e.key === "ArrowDown") { hi = Math.max(hi - 1, -1); e.target.value = hi < 0 ? "" : HIST[hi]; e.preventDefault(); }
});
document.addEventListener("keydown", function (e) {
var t = e.target.tagName;
if (t === "INPUT" || t === "TEXTAREA") {
if (e.key === "Escape") { if (t === "INPUT" && e.target.id === "q") toggleSearch(false); e.target.blur(); }
return;
}
if (e.key === "/") { e.preventDefault(); toggleSearch(true); return; }
if (e.key === ":" ) { e.preventDefault(); promptOpen(true); return; }
if (e.key === "Escape") { promptOpen(false); toggleSearch(false); return; }
if (e.key >= "1" && e.key <= "4") { go(["trieste", "italia", "mondo", "diff"][+e.key - 1]); return; }
var cards = document.querySelectorAll(".card");
if (!cards.length) return;
if (e.key === "j" || e.key === "k") {
e.preventDefault();
S.cursor = Math.max(0, Math.min(cards.length - 1, S.cursor + (e.key === "j" ? 1 : -1)));
Array.prototype.forEach.call(cards, function (c, i) { c.classList.toggle("cursor", i === S.cursor); });
cards[S.cursor].scrollIntoView({ block: "center", behavior: "smooth" });
} else if (e.key === "Enter" && S.cursor >= 0) {
e.preventDefault();
cards[S.cursor].querySelector(".chead").click();
}
});
window.addEventListener("hashchange", function () {
go((location.hash || "").replace("#/", "") || "trieste", false);
});
function netState() { $("#offline").classList.toggle("on", !navigator.onLine); }
window.addEventListener("online", netState);
window.addEventListener("offline", netState);
boot(function () {
netState();
load().then(function () {
paintStatus();
go((location.hash || "").replace("#/", "") || "trieste", false);
setInterval(function () { $("#ledtxt").textContent = clock(); }, 1000);
});
});
if ("serviceWorker" in navigator) {
window.addEventListener("load", function () {
navigator.serviceWorker.register("sw.js").catch(function () {});
});
}
})();
</script>
</body>
</html>
